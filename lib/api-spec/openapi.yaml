openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Structured Cabling Labor Estimator API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: estimates
    description: Cabling labor estimates
  - name: runs
    description: Cable run groups within an estimate
  - name: rates
    description: Productivity rate configuration
  - name: calculator
    description: Stateless calculation preview
  - name: pathwayEstimates
    description: Saved pathway estimates
  - name: pathwaySegments
    description: Pathway segments within a pathway estimate
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /estimates:
    get:
      operationId: listEstimates
      tags: [estimates]
      summary: List all estimates
      responses:
        "200":
          description: List of estimates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EstimateSummary"
    post:
      operationId: createEstimate
      tags: [estimates]
      summary: Create a new estimate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEstimateBody"
      responses:
        "201":
          description: Created estimate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Estimate"

  /estimates/{id}:
    get:
      operationId: getEstimate
      tags: [estimates]
      summary: Get an estimate with all runs and computed totals
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Estimate with runs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EstimateDetail"
        "404":
          description: Not found
    put:
      operationId: updateEstimate
      tags: [estimates]
      summary: Update an estimate
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEstimateBody"
      responses:
        "200":
          description: Updated estimate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Estimate"
    delete:
      operationId: deleteEstimate
      tags: [estimates]
      summary: Delete an estimate
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /estimates/{id}/runs:
    post:
      operationId: createRun
      tags: [runs]
      summary: Add a cable run to an estimate
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRunBody"
      responses:
        "201":
          description: Created run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"

  /runs/{id}:
    put:
      operationId: updateRun
      tags: [runs]
      summary: Update a cable run
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRunBody"
      responses:
        "200":
          description: Updated run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
    delete:
      operationId: deleteRun
      tags: [runs]
      summary: Delete a cable run
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /rates:
    get:
      operationId: getRates
      tags: [rates]
      summary: Get all productivity rates and multipliers
      responses:
        "200":
          description: Rate config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RatesConfig"
    put:
      operationId: updateRates
      tags: [rates]
      summary: Update productivity rates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RatesConfig"
      responses:
        "200":
          description: Updated rates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RatesConfig"
    post:
      operationId: resetRates
      tags: [rates]
      summary: Reset rates to defaults
      responses:
        "200":
          description: Reset rates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RatesConfig"

  /pathway-estimates:
    get:
      operationId: listPathwayEstimates
      tags: [pathwayEstimates]
      summary: List all pathway estimates
      responses:
        "200":
          description: List of pathway estimates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PathwayEstimateSummary"
    post:
      operationId: createPathwayEstimate
      tags: [pathwayEstimates]
      summary: Create a new pathway estimate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePathwayEstimateBody"
      responses:
        "201":
          description: Created pathway estimate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PathwayEstimate"

  /pathway-estimates/{id}:
    get:
      operationId: getPathwayEstimate
      tags: [pathwayEstimates]
      summary: Get a pathway estimate with all segments and computed totals
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Pathway estimate with segments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PathwayEstimateDetail"
        "404":
          description: Not found
    put:
      operationId: updatePathwayEstimate
      tags: [pathwayEstimates]
      summary: Update a pathway estimate
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePathwayEstimateBody"
      responses:
        "200":
          description: Updated pathway estimate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PathwayEstimate"
    delete:
      operationId: deletePathwayEstimate
      tags: [pathwayEstimates]
      summary: Delete a pathway estimate
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /pathway-estimates/{id}/segments:
    post:
      operationId: createPathwaySegment
      tags: [pathwaySegments]
      summary: Add a segment to a pathway estimate
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePathwaySegmentBody"
      responses:
        "201":
          description: Created segment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PathwaySegment"

  /pathway-segments/{id}:
    put:
      operationId: updatePathwaySegment
      tags: [pathwaySegments]
      summary: Update a pathway segment
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePathwaySegmentBody"
      responses:
        "200":
          description: Updated segment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PathwaySegment"
    delete:
      operationId: deletePathwaySegment
      tags: [pathwaySegments]
      summary: Delete a pathway segment
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /calculator/preview:
    post:
      operationId: previewCalculation
      tags: [calculator]
      summary: Stateless calculation of an estimate (no persistence)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalculationInput"
      responses:
        "200":
          description: Calculation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalculationResult"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    CableType:
      type: string
      enum: [category, fiber, coax_rg6, coax_rg11, speaker_cable]

    InstallType:
      type: string
      enum: [new_install, retrofit, deinstall]

    CeilingType:
      type: string
      enum: [open, drywall, hard_lid]

    PathwayComplexity:
      type: string
      enum: [low, medium, high]

    BuildingType:
      type: string
      enum: [office, warehouse, retail, healthcare]

    PathwayTypeKey:
      type: string
      enum:
        [
          cable_tray,
          wire_basket,
          solid_tray,
          j_hooks,
          d_rings,
          arlington_loops,
          emt_conduit,
          pvc_conduit,
          sleeves,
          unistrut_rod,
        ]

    PathwayMountingHeight:
      type: string
      enum: [8ft, 12ft, 16ft, 20ft]

    PathwayCeilingKey:
      type: string
      enum: [open_deck, t_bar, drywall, concrete]

    PathwayCableFill:
      type: string
      enum: [light, medium, heavy]

    WorkEnvironment:
      type: string
      enum: [occupied, unoccupied]

    SkillLevel:
      type: string
      enum: [apprentice, journeyman, lead]

    EstimateSummary:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        installType:
          $ref: "#/components/schemas/InstallType"
        buildingType:
          $ref: "#/components/schemas/BuildingType"
        environment:
          $ref: "#/components/schemas/WorkEnvironment"
        skillLevel:
          $ref: "#/components/schemas/SkillLevel"
        hourlyRate:
          type: number
        runCount:
          type: integer
        totalDrops:
          type: integer
        totalHoursAvg:
          type: number
        totalCostAvg:
          type: number
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        [
          id,
          name,
          installType,
          buildingType,
          environment,
          skillLevel,
          hourlyRate,
          runCount,
          totalDrops,
          totalHoursAvg,
          totalCostAvg,
          createdAt,
          updatedAt,
        ]

    Estimate:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        installType:
          $ref: "#/components/schemas/InstallType"
        buildingType:
          $ref: "#/components/schemas/BuildingType"
        environment:
          $ref: "#/components/schemas/WorkEnvironment"
        skillLevel:
          $ref: "#/components/schemas/SkillLevel"
        hourlyRate:
          type: number
        notes:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        [
          id,
          name,
          installType,
          buildingType,
          environment,
          skillLevel,
          hourlyRate,
          createdAt,
          updatedAt,
        ]

    Run:
      type: object
      properties:
        id:
          type: integer
        estimateId:
          type: integer
        label:
          type: string
        cableType:
          type: string
        numCables:
          type: integer
          description: Number of cables pulled simultaneously in this run (used as B in bulk factor formula)
        fiberStrands:
          type: integer
          description: Strands per fiber cable (only meaningful for fiber); each strand is terminated separately. Defaults to 1.
        lengthFt:
          type: number
          description: Average cable length per cable in feet
        ceilingType:
          $ref: "#/components/schemas/CeilingType"
        pathwayComplexity:
          $ref: "#/components/schemas/PathwayComplexity"
        sortOrder:
          type: integer
        createdAt:
          type: string
          format: date-time
      required:
        [
          id,
          estimateId,
          label,
          cableType,
          numCables,
          lengthFt,
          ceilingType,
          pathwayComplexity,
          sortOrder,
          createdAt,
        ]

    RunCalculation:
      type: object
      description: Computed labor breakdown for a single cable run group
      properties:
        runId:
          type: integer
        label:
          type: string
        cableType:
          type: string
        numCables:
          type: integer
          description: Cables pulled simultaneously (B) — drives the bulk factor
        fiberStrands:
          type: integer
          description: Strands per fiber cable; multiplies termination labor (1 for non-fiber)
        lengthFt:
          type: number
        ceilingType:
          $ref: "#/components/schemas/CeilingType"
        pathwayComplexity:
          $ref: "#/components/schemas/PathwayComplexity"
        bulkFactor:
          type: number
          description: "Computed efficiency factor: 0.4 + (0.6 / numCables)"
        pullMinutesPer10Ft:
          type: number
          description: Base pull rate in minutes per 10 ft for this cable type
        terminationMinutesPerEnd:
          type: number
          description: Base termination time in minutes per end for this cable type
        conditionMultiplier:
          type: number
          description: Combined site/condition multiplier (install × ceiling × pathway × building × environment × skill)
        pullHoursPerCable:
          type: number
          description: Pull hours for one cable within a single bulk pass (after condition mult + bulk factor)
        terminationHoursPerCable:
          type: number
          description: Termination hours per cable (both ends, after condition mult — NOT bulk-discounted)
        adjustedHoursPerCable:
          type: number
          description: Average total hours per cable = (totalPullHours + totalTermHours) / numCables
        runHoursLow:
          type: number
        runHoursAvg:
          type: number
        runHoursHigh:
          type: number
        runCostLow:
          type: number
        runCostAvg:
          type: number
        runCostHigh:
          type: number
      required:
        [
          label,
          cableType,
          numCables,
          lengthFt,
          ceilingType,
          pathwayComplexity,
          bulkFactor,
          pullMinutesPer10Ft,
          terminationMinutesPerEnd,
          conditionMultiplier,
          pullHoursPerCable,
          terminationHoursPerCable,
          adjustedHoursPerCable,
          runHoursLow,
          runHoursAvg,
          runHoursHigh,
          runCostLow,
          runCostAvg,
          runCostHigh,
        ]

    TaskBreakdownItem:
      type: object
      properties:
        task:
          type: string
        percent:
          type: number
        hoursAvg:
          type: number
        costAvg:
          type: number
      required: [task, percent, hoursAvg, costAvg]

    EstimateTotals:
      type: object
      properties:
        totalCables:
          type: integer
        totalRuns:
          type: integer
        totalHoursLow:
          type: number
        totalHoursAvg:
          type: number
        totalHoursHigh:
          type: number
        totalCostLow:
          type: number
        totalCostAvg:
          type: number
        totalCostHigh:
          type: number
        bulkSavingsHours:
          type: number
          description: Hours saved by pulling cables in a single bulk pass vs. pulling each one solo
        taskBreakdown:
          type: array
          items:
            $ref: "#/components/schemas/TaskBreakdownItem"
      required:
        [
          totalCables,
          totalRuns,
          totalHoursLow,
          totalHoursAvg,
          totalHoursHigh,
          totalCostLow,
          totalCostAvg,
          totalCostHigh,
          bulkSavingsHours,
          taskBreakdown,
        ]

    EstimateDetail:
      type: object
      properties:
        estimate:
          $ref: "#/components/schemas/Estimate"
        runs:
          type: array
          items:
            $ref: "#/components/schemas/RunCalculation"
        totals:
          $ref: "#/components/schemas/EstimateTotals"
      required: [estimate, runs, totals]

    CreateEstimateBody:
      type: object
      properties:
        name:
          type: string
        installType:
          $ref: "#/components/schemas/InstallType"
        buildingType:
          $ref: "#/components/schemas/BuildingType"
        environment:
          $ref: "#/components/schemas/WorkEnvironment"
        skillLevel:
          $ref: "#/components/schemas/SkillLevel"
        hourlyRate:
          type: number
        notes:
          type: string
          nullable: true
      required:
        [name, installType, buildingType, environment, skillLevel, hourlyRate]

    UpdateEstimateBody:
      type: object
      properties:
        name:
          type: string
        installType:
          $ref: "#/components/schemas/InstallType"
        buildingType:
          $ref: "#/components/schemas/BuildingType"
        environment:
          $ref: "#/components/schemas/WorkEnvironment"
        skillLevel:
          $ref: "#/components/schemas/SkillLevel"
        hourlyRate:
          type: number
        notes:
          type: string
          nullable: true
      required:
        [name, installType, buildingType, environment, skillLevel, hourlyRate]

    CreateRunBody:
      type: object
      properties:
        label:
          type: string
        cableType:
          type: string
        numCables:
          type: integer
        fiberStrands:
          type: integer
          minimum: 1
        lengthFt:
          type: number
        ceilingType:
          $ref: "#/components/schemas/CeilingType"
        pathwayComplexity:
          $ref: "#/components/schemas/PathwayComplexity"
      required:
        [
          label,
          cableType,
          numCables,
          lengthFt,
          ceilingType,
          pathwayComplexity,
        ]

    UpdateRunBody:
      type: object
      properties:
        label:
          type: string
        cableType:
          type: string
        numCables:
          type: integer
        fiberStrands:
          type: integer
          minimum: 1
        lengthFt:
          type: number
        ceilingType:
          $ref: "#/components/schemas/CeilingType"
        pathwayComplexity:
          $ref: "#/components/schemas/PathwayComplexity"
      required:
        [
          label,
          cableType,
          numCables,
          lengthFt,
          ceilingType,
          pathwayComplexity,
        ]

    CustomCableType:
      type: object
      properties:
        value:
          type: string
          description: Unique identifier key for the cable type (e.g. "my_cable")
        label:
          type: string
          description: Human-readable display name (e.g. "My Cable")
      required: [value, label]

    PathwayTypeRate:
      type: object
      description: Editable cost/labor rates for a single pathway type.
      properties:
        laborMinPerFt: { type: number }
        materialCostPerFt: { type: number }
        fastenerSpacingFt: { type: number }
        fastenerCostEach: { type: number }
        fastenerLaborMinEach: { type: number }
      required:
        [laborMinPerFt, materialCostPerFt, fastenerSpacingFt, fastenerCostEach, fastenerLaborMinEach]

    PathwayCableFillMult:
      type: object
      description: Labor and material multipliers for a single cable-fill bracket.
      properties:
        laborMult: { type: number }
        materialMult: { type: number }
      required: [laborMult, materialMult]

    RatesConfig:
      type: object
      properties:
        hourlyRate:
          type: number
          description: Default hourly labor rate ($/hr) shared by both estimators.
        bulkFactorAlpha:
          type: number
          minimum: 0
          description: |
            Sensitivity (α) of the bulk-pull difficulty curve.
            bulkFactor = 1 + α × ln(numCables). Larger α = steeper penalty
            for pulling more cables together. Default 0.15.
        customCableTypes:
          type: array
          description: User-defined cable types added beyond the built-in list
          items:
            $ref: "#/components/schemas/CustomCableType"
        pullMinutesPer10Ft:
          type: object
          description: Pull labor in minutes for every 10 ft of cable, by cable type
          additionalProperties:
            type: number
          properties:
            category: { type: number }
            fiber: { type: number }
            coax_rg6: { type: number }
            coax_rg11: { type: number }
            speaker_cable: { type: number }
          required:
            [category, fiber, coax_rg6, coax_rg11, speaker_cable]
        terminationMinutesPerEnd:
          type: object
          description: Termination labor in minutes per cable end, by cable type (each cable has 2 ends)
          additionalProperties:
            type: number
          properties:
            category: { type: number }
            fiber: { type: number }
            coax_rg6: { type: number }
            coax_rg11: { type: number }
            speaker_cable: { type: number }
          required:
            [category, fiber, coax_rg6, coax_rg11, speaker_cable]
        installTypeMult:
          type: object
          properties:
            new_install: { type: number }
            retrofit: { type: number }
            deinstall: { type: number }
          required: [new_install, retrofit, deinstall]
        ceilingMult:
          type: object
          properties:
            open: { type: number }
            drywall: { type: number }
            hard_lid: { type: number }
          required: [open, drywall, hard_lid]
        pathwayMult:
          type: object
          properties:
            low: { type: number }
            medium: { type: number }
            high: { type: number }
          required: [low, medium, high]
        buildingMult:
          type: object
          properties:
            office: { type: number }
            warehouse: { type: number }
            retail: { type: number }
            healthcare: { type: number }
          required: [office, warehouse, retail, healthcare]
        environmentMult:
          type: object
          properties:
            occupied: { type: number }
            unoccupied: { type: number }
          required: [occupied, unoccupied]
        skillMult:
          type: object
          properties:
            apprentice: { type: number }
            journeyman: { type: number }
            lead: { type: number }
          required: [apprentice, journeyman, lead]
        pathwayTypeRates:
          type: object
          description: Per-pathway-type editable rates (keyed by pathway type value).
          additionalProperties:
            $ref: "#/components/schemas/PathwayTypeRate"
        pathwayMountingHeightMult:
          type: object
          description: Mounting height labor multipliers (keyed by height bracket).
          additionalProperties:
            type: number
        pathwayCeilingMult:
          type: object
          description: Pathway ceiling type labor multipliers.
          additionalProperties:
            type: number
        pathwayCableFillMult:
          type: object
          description: Cable fill labor and material multipliers.
          additionalProperties:
            $ref: "#/components/schemas/PathwayCableFillMult"
        pathwayBendLaborHrs:
          type: number
          description: Hours added per 90° bend in a pathway run.
        pathwayBendMaterialCost:
          type: number
          description: Material cost per 90° bend ($).
        pathwayPenetrationLaborHrs:
          type: number
          description: Hours added per fire-rated wall/floor penetration.
        pathwayPenetrationMaterialCost:
          type: number
          description: Material cost per fire-rated penetration ($).
      required:
        [
          pullMinutesPer10Ft,
          terminationMinutesPerEnd,
          installTypeMult,
          ceilingMult,
          pathwayMult,
          buildingMult,
          environmentMult,
          skillMult,
        ]

    CalculationInput:
      type: object
      properties:
        installType:
          $ref: "#/components/schemas/InstallType"
        buildingType:
          $ref: "#/components/schemas/BuildingType"
        environment:
          $ref: "#/components/schemas/WorkEnvironment"
        skillLevel:
          $ref: "#/components/schemas/SkillLevel"
        hourlyRate:
          type: number
        runs:
          type: array
          items:
            $ref: "#/components/schemas/CreateRunBody"
      required:
        [installType, buildingType, environment, skillLevel, hourlyRate, runs]

    CalculationResult:
      type: object
      properties:
        runs:
          type: array
          items:
            $ref: "#/components/schemas/RunCalculation"
        totals:
          $ref: "#/components/schemas/EstimateTotals"
      required: [runs, totals]

    PathwayEstimate:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        installType: { $ref: "#/components/schemas/InstallType" }
        buildingType: { $ref: "#/components/schemas/BuildingType" }
        environment: { $ref: "#/components/schemas/WorkEnvironment" }
        skillLevel: { $ref: "#/components/schemas/SkillLevel" }
